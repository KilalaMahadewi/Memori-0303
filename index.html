<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kita, Dalam Beberapa Babak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Newsreader:ital,wght@0,400;1,400&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="buku">
    <div id="track"></div>
  </main>

  <!-- Sampul: tirai yang akan terbuka -->
  <section id="sampul">
    <div class="tirai kiri"></div>
    <div class="tirai kanan"></div>
    <div class="isi-sampul" id="isiSampul"></div>
  </section>

  <nav id="kontrol" hidden>
    <button id="prev" aria-label="Babak sebelumnya">&#8592;</button>
    <div id="titik" role="presentation"></div>
    <button id="next" aria-label="Babak berikutnya">&#8594;</button>
  </nav>

  <button id="musik" aria-label="Putar atau jeda musik" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18V5l11-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="17" cy="16" r="3"/>
  </svg>
</button>
  <audio id="audio" loop preload="auto"></audio>

  <script src="cerita.js"></script>
  <script src="script.js"></script>
</body>
</html>
